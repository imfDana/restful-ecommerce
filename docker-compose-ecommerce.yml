# Local usage:  docker compose -f docker-compose-ecommerce.yml up -d --build
# CI usage:     image is pre-built by docker/build-push-action with GHA layer
#               caching; compose just starts the already-built image.
# To stop:      docker compose -f docker-compose-ecommerce.yml down

services:
  restful-ecommerce:
    # In CI the image is pre-built and tagged as restful-ecommerce:ci.
    # Locally you can override with: COMPOSE_IMAGE=restful-ecommerce docker compose up --build
    image: ${COMPOSE_IMAGE:-restful-ecommerce:ci}
    build: .          # used only when --build is passed (local dev)
    ports:
      - 3004:3004
    env_file:
      - .env
    volumes:
      - ./:/app
    working_dir: /app
    # Healthcheck lets Docker (and CI) know when the app is truly ready.
    # wait-on will also benefit from this via /health returning HTTP 200.
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3004/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s