# To execute: docker compose -f docker-compose-ecommerce.yml up -d
# To stop:    docker compose -f docker-compose-ecommerce.yml down

services:
  restful-ecommerce:
    build: .
    ports:
      - 3004:3004
    env_file:
      - .env
    volumes:
      - ./:/app
    working_dir: /app
    # Healthcheck lets Docker (and CI) know when the app is truly ready.
    # wait-on will also benefit from this via /health returning HTTP 200.
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3004/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s