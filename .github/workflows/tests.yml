# CI Workflow — Unit Tests + Newman API Suite
# Runs on every push/PR to main or issue-* branches

name: CI - Unit Tests + Newman QA Suite

on:
  push:
    branches:
      - main
      - issue-*
  pull_request_target:
    branches:
      - main
      - issue-*

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: Build with bare Node and run unit tests
  # ─────────────────────────────────────────────────────────────────────────────
  Unit_Tests:
    name: Run Unit Tests (Node)
    runs-on: ubuntu-latest
    permissions:
      checks: write

    env:
      AUTH_USERNAME: ${{ secrets.AUTH_USERNAME }}
      AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Create .env from secrets
        # NOTE: unquoted EOF so the shell receives literal values already
        # expanded by GitHub Actions before the step runs.
        run: |
          cat > .env <<EOF
          AUTH_USERNAME=${{ secrets.AUTH_USERNAME }}
          AUTH_PASSWORD=${{ secrets.AUTH_PASSWORD }}
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          EOF

      - name: Start the app in background
        run: npm start &

      # Use the /health endpoint (returns HTTP 200) instead of / (returns 404).
      # wait-on treats any non-2xx as "not ready" — that was the root cause.
      - name: Wait for the service to be healthy
        run: npx wait-on http://localhost:3004/health --timeout 30000

      - name: Run unit tests
        run: npm test

      - name: Kill Node process
        if: always()
        run: pkill -f node || true

      - name: Publish Test Report
        uses: dorny/test-reporter@v3
        if: success() || failure()
        with:
          name: Unit Test Report
          path: ${{ github.workspace }}/reports/test-results.json
          reporter: mocha-json

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: Build via Docker Compose and run Newman API tests
  # Only runs after unit tests pass (needs: Unit_Tests).
  # ─────────────────────────────────────────────────────────────────────────────
  Newman_API_Tests:
    name: Run Newman API Tests (Docker Compose)
    runs-on: ubuntu-latest
    needs: Unit_Tests          # Don't waste Docker build time if unit tests fail
    permissions:
      checks: write

    env:
      AUTH_USERNAME: ${{ secrets.AUTH_USERNAME }}
      AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Create .env from secrets
        run: |
          cat > .env <<EOF
          AUTH_USERNAME=${{ secrets.AUTH_USERNAME }}
          AUTH_PASSWORD=${{ secrets.AUTH_PASSWORD }}
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          EOF

      - name: Start service via Docker Compose
        run: docker compose -f docker-compose-ecommerce.yml up -d --build

      # Docker image builds on a cold runner take 60-90 s.
      # The previous 60 000 ms timeout was consistently too short.
      # Using /health (200 OK) so wait-on resolves immediately once ready.
      - name: Wait for the service to be healthy
        run: npx wait-on http://localhost:3004/health --timeout 120000

      - name: Install Newman and reporters
        run: npm install -g newman newman-reporter-htmlextra newman-reporter-junitfull

      - name: Run Newman API tests
        run: |
          mkdir -p postman/reports
          newman run postman/restful-ecommerce-collection.json \
            -e postman/environments/environment-qa.json \
            --env-var "username=${{ secrets.AUTH_USERNAME }}" \
            --env-var "password=${{ secrets.AUTH_PASSWORD }}" \
            -r cli,htmlextra,junitfull \
            --reporter-htmlextra-export postman/reports/report.html \
            --reporter-junitfull-export postman/reports/results.xml

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-reports
          path: postman/reports/

      - name: Stop Docker Compose service
        if: always()
        run: docker compose -f docker-compose-ecommerce.yml down --remove-orphans || true