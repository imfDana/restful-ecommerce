# CI Workflow — Newman API Suite (Docker Compose)
# Runs on every push/PR to main or issue-* branches

name: CI - Newman API Tests

on:
  push:
    branches:
      - main
      - issue-*
  pull_request_target:
    branches:
      - main
      - issue-*

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Build via Docker Compose and run Newman API tests
  # ─────────────────────────────────────────────────────────────────────────────
  Newman_API_Tests:
    name: Run Newman API Tests (Docker Compose)
    runs-on: ubuntu-latest
    permissions:
      checks: write

    env:
      AUTH_USERNAME: ${{ secrets.AUTH_USERNAME }}
      AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env from secrets
        run: |
          cat > .env <<EOF
          AUTH_USERNAME=${{ secrets.AUTH_USERNAME }}
          AUTH_PASSWORD=${{ secrets.AUTH_PASSWORD }}
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          EOF

      # Enable BuildKit with the docker-container driver, which is required
      # to use GitHub Actions cache (type=gha) in the build step below.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build the image once with layer caching so subsequent runs are fast.
      # cache-from: pulls cached layers from the GHA cache on cache hits.
      # cache-to:   saves new/changed layers back to the GHA cache for the next run.
      # load: true  makes the built image available to docker compose (local daemon).
      - name: Build Docker image (with layer cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: restful-ecommerce:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Image is already built and tagged — no need for --build here.
      # Compose picks up restful-ecommerce:ci via the image: key in compose file.
      - name: Start service via Docker Compose
        run: docker compose -f docker-compose-ecommerce.yml up -d
        env:
          COMPOSE_DOCKER_CLI_BUILD: 0

      # /health returns HTTP 200 once the app is ready.
      # 120 s is generous; with layer caching the container starts in seconds.
      - name: Wait for the service to be healthy
        run: npx wait-on http://localhost:3004/health --timeout 120000

      - name: Install Newman and reporters
        run: npm install -g newman newman-reporter-htmlextra newman-reporter-junitfull

      - name: Run Newman API tests
        run: |
          mkdir -p postman/reports
          newman run postman/restful-ecommerce-collection.json \
            -e postman/environments/environment-qa.json \
            --env-var "username=${{ secrets.AUTH_USERNAME }}" \
            --env-var "password=${{ secrets.AUTH_PASSWORD }}" \
            -r cli,htmlextra,junitfull \
            --reporter-htmlextra-export postman/reports/report.html \
            --reporter-junitfull-export postman/reports/results.xml

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-reports
          path: postman/reports/

      - name: Stop Docker Compose service
        if: always()
        run: docker compose -f docker-compose-ecommerce.yml down --remove-orphans || true