# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: CI - Unit Tests + Newman QA Suite

on:
  push:
    branches: 
      - main
      - issue-*
  pull_request_target:
    branches: 
      - main
      - issue-*
      
jobs:
  Build_App_using_node_and_Run_Tests:
    name: Build Service using Node and Run unit tests

    runs-on: ubuntu-latest
    permissions:
      checks: write
    
    env:
      AUTH_USERNAME: ${{secrets.AUTH_USERNAME}}
      AUTH_PASSWORD: ${{secrets.AUTH_PASSWORD}}
      SECRET_KEY: ${{secrets.SECRET_KEY}}
  
    steps:
    - name: Checkout
      uses: actions/checkout@v4  # Cambiado de v6 a v4

    - name: Install the dependencies
      run: npm ci

    - name: Create .env from secrets
      run: |
        cat > .env <<'EOF'
        AUTH_USERNAME=${{ secrets.AUTH_USERNAME }}
        AUTH_PASSWORD=${{ secrets.AUTH_PASSWORD }}
        SECRET_KEY=${{ secrets.SECRET_KEY }}
        EOF

    - name: Start the app in background
      run: |
        npm start &
        npx wait-on http://localhost:3004

    - name: Run the tests
      run: npm test
  
    - name: Kill all instances of Node
      run: pkill -f node || true  # Añadido || true para que no falle si no hay procesos
    
    - name: Test Report
      uses: dorny/test-reporter@v3
      if: success() || failure()
      with:
          name: Test Report
          path: ${{ github.workspace }}/reports/test-results.json
          reporter: 'mocha-json'

  Build_App_Docker_Compose_and_Run_Test:
    name: Build Service using Docker Compose and run unit tests

    runs-on: ubuntu-latest
    permissions:
      checks: write
    
    env:
      AUTH_USERNAME: ${{secrets.AUTH_USERNAME}}
      AUTH_PASSWORD: ${{secrets.AUTH_PASSWORD}}
      SECRET_KEY: ${{secrets.SECRET_KEY}}
  
    steps:
    - name: Checkout
      uses: actions/checkout@v4  # Cambiado de v6 a v4

    - name: Install the dependencies
      run: npm ci

    - name: Create .env from secrets
      run: |
        cat > .env <<'EOF'
        AUTH_USERNAME=${{ secrets.AUTH_USERNAME }}
        AUTH_PASSWORD=${{ secrets.AUTH_PASSWORD }}
        SECRET_KEY=${{ secrets.SECRET_KEY }}
        EOF

    - name: Start the service using Docker Compose
      run: docker compose -f docker-compose-ecommerce.yml up -d
    
    - name: Wait for service to be available
      run: npx wait-on http://localhost:3004 --timeout 60000  # Añadido timeout

    - name: Run the unit tests
      run: npm run unit-test

    - name: Stop the service
      if: always()
      run: docker compose -f docker-compose-ecommerce.yml down --remove-orphans || true  # Añadido || true

  Run_Newman_API_Tests:
    name: Run Newman API Tests
    runs-on: ubuntu-latest
    permissions:
      checks: write
    
    env:
      AUTH_USERNAME: ${{secrets.AUTH_USERNAME}}
      AUTH_PASSWORD: ${{secrets.AUTH_PASSWORD}}
      SECRET_KEY: ${{secrets.SECRET_KEY}}
  
    steps:
    - name: Checkout
      uses: actions/checkout@v4  # Cambiado de v6 a v4

    - name: Install the dependencies
      run: npm ci

    - name: Create .env from secrets
      run: |
        cat > .env <<'EOF'
        AUTH_USERNAME=${{ secrets.AUTH_USERNAME }}
        AUTH_PASSWORD=${{ secrets.AUTH_PASSWORD }}
        SECRET_KEY=${{ secrets.SECRET_KEY }}
        EOF

    - name: Start the service using Docker Compose
      run: docker compose -f docker-compose-ecommerce.yml up -d
    
    - name: Wait for service to be available
      run: npx wait-on http://localhost:3004 --timeout 60000  # Añadido timeout

    - name: Install Newman and Reporters
      run: npm install -g newman newman-reporter-htmlextra newman-reporter-junitfull

    - name: Run Newman API Tests
      run: |
        mkdir -p postman/reports
        newman run postman/restful-ecommerce-collection.json \
          -e postman/environments/environment-qa.json \
          --env-var "username=${{ secrets.AUTH_USERNAME }}" \
          --env-var "password=${{ secrets.AUTH_PASSWORD }}" \
          -r cli,htmlextra,junitfull \
          --reporter-htmlextra-export postman/reports/report.html \
          --reporter-junitfull-export postman/reports/results.xml

    - name: Upload Test Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: api-test-reports
        path: postman/reports/

    - name: Stop the service
      if: always()
      run: docker compose -f docker-compose-ecommerce.yml down --remove-orphans || true  # Añadido || true